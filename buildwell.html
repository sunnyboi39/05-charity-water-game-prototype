<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Charity Water Game- well builder</title>
      <link rel="stylesheet" href="wellstyle.css">
    </head>
    <body id="body">
      <div id="dir">
        <h1>Lay The Stones</h1>
      </div>
      <div class="wellcontainer" id="wellcontainer">
        
        <div class="wellbox">
          <img class="well"  id="well" src="img/well.png">
        </div>
      </div>
      <div id="start-div">
        <button id="start-butt">Start</button>
      </div>
      <div id="stonebuttdiv">
        <button id="stone-button" disabled="true">Place Stone</button>
      </div>
      <div id="contdiv">
        <button id="continue-button">Replay</button>
      </div>
      <script type="module" src="laystones.js"></script>
    </body>
  </html>
